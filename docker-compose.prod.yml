services:
  db:
    image: postgres:16
    container_name: limiarcontrol-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-limiarcontrol}
    volumes:
      - limiarcontrol_db:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: limiarcontrol-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - limiarcontrol_minio:/data
    networks:
      - internal
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: limiarcontrol-centrifugo
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro,Z
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET is required}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?CENTRIFUGO_ALLOWED_ORIGINS is required}
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_API_BASE_URL: ${DOCKER_VITE_API_BASE_URL:-/api}
        VITE_CENTRIFUGO_URL: ${DOCKER_VITE_CENTRIFUGO_URL:-ws://localhost:8001/connection/websocket}
        VITE_ENABLE_MUSIC: ${DOCKER_VITE_ENABLE_MUSIC:-true}
        VITE_ENABLE_MAPS: ${DOCKER_VITE_ENABLE_MAPS:-true}
    container_name: limiarcontrol-api
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-limiarcontrol}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET is required}
      CENTRIFUGO_PUBLIC_URL: ${CENTRIFUGO_PUBLIC_URL:?CENTRIFUGO_PUBLIC_URL is required}
      LIMIAR_MAP_INTERNAL_KEY: ${LIMIAR_MAP_INTERNAL_KEY:?LIMIAR_MAP_INTERNAL_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MEDIA_LEGACY_ALLOWED_ORIGINS: ${MEDIA_LEGACY_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      centrifugo:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  limiarcontrol_db:
  limiarcontrol_minio:

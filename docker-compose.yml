services:
  db:
    image: postgres:16
    container_name: limiarcontrol-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-limiarcontrol}
    volumes:
      - limiarcontrol_db:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: limiarcontrol-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - limiarcontrol_minio:/data

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: limiarcontrol-centrifugo
    ports:
      - "8001:8000"
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro,Z
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-dev-secret-change-me}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:5173 http://127.0.0.1:5173 http://localhost:5174 http://127.0.0.1:5174 http://localhost:${API_PORT:-8002} http://127.0.0.1:${API_PORT:-8002}}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-development}
        VITE_API_BASE_URL: ${DOCKER_VITE_API_BASE_URL:-/api}
        VITE_CENTRIFUGO_URL: ${DOCKER_VITE_CENTRIFUGO_URL:-ws://localhost:8001/connection/websocket}
        VITE_ENABLE_MUSIC: ${DOCKER_VITE_ENABLE_MUSIC:-true}
        VITE_ENABLE_MAPS: ${DOCKER_VITE_ENABLE_MAPS:-true}
    container_name: limiarcontrol-api
    ports:
      - "${API_PORT:-8002}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-limiarcontrol}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-secret-change-me}
      CENTRIFUGO_PUBLIC_URL: ${CENTRIFUGO_PUBLIC_URL:-ws://localhost:8001/connection/websocket}
      LIMIAR_MAP_INTERNAL_KEY: ${LIMIAR_MAP_INTERNAL_KEY:-dev-map-internal-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:${API_PORT:-8002},http://127.0.0.1:${API_PORT:-8002}}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-limiarcontrol-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MEDIA_LEGACY_ALLOWED_ORIGINS: ${MEDIA_LEGACY_ALLOWED_ORIGINS:-}
    depends_on:
      - db
      - centrifugo
      - minio

volumes:
  limiarcontrol_db:
  limiarcontrol_minio:

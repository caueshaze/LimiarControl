name: limiar-lab

services:
  db:
    image: postgres:16
    container_name: limiar-lab-db
    environment:
      POSTGRES_USER: ${LAB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${LAB_POSTGRES_DB:-limiarcontrol_lab}
    volumes:
      - limiar_lab_db:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: limiar-lab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LAB_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LAB_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - limiar_lab_minio:/data
    networks:
      - internal
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: limiar-lab-centrifugo
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro,Z
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${LAB_CENTRIFUGO_TOKEN_SECRET:-dev-secret-change-me}
      CENTRIFUGO_API_KEY: ${LAB_CENTRIFUGO_API_KEY:-dev-api-key}
      CENTRIFUGO_ALLOWED_ORIGINS: ${LAB_CENTRIFUGO_ALLOWED_ORIGINS:?LAB_CENTRIFUGO_ALLOWED_ORIGINS is required (public browser origin(s))}
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_API_BASE_URL: ${LAB_DOCKER_VITE_API_BASE_URL:-/api}
        VITE_CENTRIFUGO_URL: ${LAB_DOCKER_VITE_CENTRIFUGO_URL:?LAB_DOCKER_VITE_CENTRIFUGO_URL is required (public wss:// URL served by nginx)}
        VITE_ENABLE_MUSIC: ${LAB_DOCKER_VITE_ENABLE_MUSIC:-true}
        VITE_ENABLE_MAPS: ${LAB_DOCKER_VITE_ENABLE_MAPS:-true}
    container_name: limiar-lab-api
    ports:
      - "127.0.0.1:${LAB_API_PORT:-8002}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${LAB_POSTGRES_USER:-postgres}:${LAB_POSTGRES_PASSWORD:-postgres}@db:5432/${LAB_POSTGRES_DB:-limiarcontrol_lab}
      JWT_SECRET: ${LAB_JWT_SECRET:?LAB_JWT_SECRET is required}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${LAB_CENTRIFUGO_API_KEY:-dev-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${LAB_CENTRIFUGO_TOKEN_SECRET:-dev-secret-change-me}
      CENTRIFUGO_INTERNAL_WS_URL: ws://centrifugo:8000/connection/websocket
      LIMIAR_MAP_INTERNAL_KEY: ${LAB_LIMIAR_MAP_INTERNAL_KEY:-dev-map-internal-key}
      CORS_ORIGIN: ${LAB_CORS_ORIGIN:?LAB_CORS_ORIGIN is required (public HTTPS origin(s) used by the SPA)}
      AUTO_MIGRATE: ${LAB_AUTO_MIGRATE:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${LAB_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${LAB_MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${LAB_MINIO_BUCKET:-limiarcontrol-media}
      MINIO_SECURE: ${LAB_MINIO_SECURE:-false}
      MEDIA_LEGACY_ALLOWED_ORIGINS: ${LAB_MEDIA_LEGACY_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      centrifugo:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    name: limiar_lab_internal

volumes:
  limiar_lab_db:
    name: limiar_lab_db
  limiar_lab_minio:
    name: limiar_lab_minio
